<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lumina-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="lumina-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="lumina-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="url(#lumina-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Glowing Ambient Light behind symbol -->
  <circle cx="50" cy="50" r="28" fill="url(#lumina-glow)" opacity="0.25" filter="url(#blur-glow)" />

  <!-- Geometric Modern AI / Pulse Mark -->
  <!-- Left Dynamic Arc -->
  <path d="M 32 30 C 24 40, 24 60, 32 70 C 37 76, 42 74, 42 67 C 36 58, 36 42, 42 33 C 42 26, 37 24, 32 30 Z" fill="url(#lumina-accent)" />
  
  <!-- Right Energy Loop -->
  <path d="M 68 70 C 76 60, 76 40, 68 30 C 63 24, 58 26, 58 33 C 64 42, 64 58, 58 67 C 58 74, 63 76, 68 70 Z" fill="url(#lumina-glow)" />

  <!-- Core Neural Spark -->
  <circle cx="50" cy="50" r="7.5" fill="url(#lumina-glow)" filter="url(#blur-glow)" />
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
  
  <!-- Top/Bottom Connecting Nodes -->
  <circle cx="50" cy="24" r="3" fill="#38bdf8" />
  <circle cx="50" cy="76" r="3" fill="#c084fc" />
</svg>
